<section class="register">

<h1>Art Class Registration Form</h1>

<form action="register.php" method="post" enctype="multipart/form-data" onsubmit="return validateForm();">

<label>Full Name</label>
<input type="text" id="name" name="name" placeholder="Enter your full name" required>

<label>Age</label>
<input type="number" id="age" name="age" min="5" max="60" placeholder="Enter your age">

<label>Gender</label>

<div class="radio-group">

<input type="radio" id="male" name="gender" value="Male">
<span>Male</span>

<input type="radio" id="female" name="gender" value="Female">
<span>Female</span>

<input type="radio" id="other" name="gender" value="Other">
<span>Other</span>

</div>

<label>Email</label>
<input type="text" id="email" name="email" placeholder="Enter your email">

<label>Mobile Number</label>
<input type="text" id="mobile" name="mobile" maxlength="10" placeholder="Enter 10-digit mobile number">

<label>Address</label>

<textarea id="address" name="address" rows="4" placeholder="Enter your address"></textarea>

<label>Select Course</label>

<select id="course" name="course">

<option value="">Select Course</option>
<option>Pencil Sketching</option>
<option>Watercolor</option>
<option>Acrylic Painting</option>
<option>Oil Painting</option>
<option>Digital Art</option>

</select>

<label>Batch Timing</label>

<select id="batch" name="batch">

<option value="">Choose Batch</option>
<option>Morning</option>
<option>Afternoon</option>
<option>Evening</option>

</select>

<label>Experience Level</label>

<select id="experience" name="experience">

<option value="">Select Experience</option>
<option>Beginner</option>
<option>Intermediate</option>
<option>Advanced</option>

</select>

<label>Upload Previous Artwork</label>

<input type="file" id="artwork" name="artwork">

<label>Create Password</label>

<input type="password" id="password" name="password" placeholder="Create password">

<label>Confirm Password</label>

<input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password">

<div class="check">

<input type="checkbox" id="agree" name="agree">

<label for="agree">I agree to the Terms & Conditions</label>

</div>

<input type="submit" value="Register">

<input type="reset" value="Reset">

</form>

</section>

<footer>

<p>
© 2026 Creative Canvas Art Academy
</p>

</footer>

</body>

</html>
