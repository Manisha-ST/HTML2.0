<section>

<h2 align="center">Animal Adoption Form</h2>

<form>

<label><b>Full Name</b></label>
<input type="text" placeholder="Enter your name" required>

<label><b>Email Address</b></label>
<input type="email" placeholder="Enter your email" required>

<label><b>Phone Number</b></label>
<input type="tel" placeholder="Enter your phone number" required>

<label><b>Address</b></label>
<textarea rows="4" placeholder="Enter your address"></textarea>

<label><b>Select the Animal You Wish to Adopt</b></label>
<select required>
    <option value="">--Select--</option>
    <option>Dog</option>
    <option>Cat</option>
    <option>Rabbit</option>
    <option>Parrot</option>
</select>

<label><b>Gender</b></label><br>

<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
<input type="radio" name="gender"> Other

<br><br>

<label><b>Have you owned a pet before?</b></label><br>

<input type="checkbox"> Yes
<input type="checkbox"> No

<br><br>

<label><b>Why do you want to adopt a pet?</b></label>
<textarea rows="5" placeholder="Write your reason here"></textarea>

<br>

<input type="submit" value="Submit">
<input type="reset" value="Reset">

</form>

</section>

</footer>
